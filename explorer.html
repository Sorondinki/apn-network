<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>APN Network - Block Explorer</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .card { background: #1e293b; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    h1 { color: #38bdf8; }
    input, button { padding: 10px; border-radius: 4px; border: none; font-size: 16px; }
    input { width: 380px; background: #334155; color: #fff; }
    button { background: #0284c7; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0369a1; }
    .status { font-size: 18px; color: #4ade80; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>🚀 APN Network Block Explorer</h1>

  <div class="card">
    <h3>Network Status</h3>
    <p>Chain Height: <strong id="blockHeight">Loading...</strong></p>
    <p>Latest Block Hash: <strong id="blockHash">Loading...</strong></p>
    <button onclick="fetchNetworkInfo()">Refresh Data</button>
  </div>

  <div class="card">
    <h3>Wallet Balance Query</h3>
    <input type="text" id="walletAddress" placeholder="Enter APN Address (0x...)">
    <button onclick="checkBalance()">Query Balance</button>
    <p class="status" id="balanceResult"></p>
  </div>

  <script>
    const RPC_URL = "http://localhost:8545";

    async function rpcCall(method, params = []) {
      const res = await fetch(RPC_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", method, params, id: 1 })
      });
      return await res.json();
    }

    async function fetchNetworkInfo() {
      try {
        const heightRes = await rpcCall("eth_blockNumber");
        const hashRes = await rpcCall("apn_getLatestBlockHash");
        
        document.getElementById("blockHeight").innerText = parseInt(heightRes.result, 16) + " (Hex: " + heightRes.result + ")";
        document.getElementById("blockHash").innerText = hashRes.result || "N/A";
      } catch (err) {
        document.getElementById("blockHeight").innerText = "RPC Server Offline";
      }
    }

    async function checkBalance() {
      const addr = document.getElementById("walletAddress").value.trim();
      if (!addr) return alert("Please enter an address");

      try {
        const res = await rpcCall("apn_getBalance", [addr]);
        if (res.result) {
          const decBalance = parseInt(res.result, 16);
          document.getElementById("balanceResult").innerText = `Balance: ${decBalance.toLocaleString()} APN (${res.result})`;
        } else {
          document.getElementById("balanceResult").innerText = "Error fetching balance";
        }
      } catch (err) {
        document.getElementById("balanceResult").innerText = "Connection failed";
      }
    }

    fetchNetworkInfo();
  </script>
</body>
</html>
